name: build-ipa

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-latest 现指向 arm64 (M1) 池，容量紧张时排队 15 分钟拿不到 runner 会被直接取消；
    # 固定到 Intel 池（4 核 14GB），避免无编译结果的"假失败"。
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && pod --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ hashFiles('Podfile.lock') }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: CocoaPods install
        timeout-minutes: 12
        run: pod install --repo-update 2>&1 | tee pod.log

      - name: Build (unsigned Release)
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild \
            -workspace CarLink.xcworkspace \
            -scheme CarLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath dd \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          set -e
          APP=dd/Build/Products/Release-iphoneos/CarLink.app
          # 从构建产物读版本号，让 Artifact 名 / IPA 文件名都自带版本，避免多次构建同名分不清
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          IPA="CarLink-v${VER}-${BUILD}-unsigned.ipa"
          echo "APP_VER=$VER" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA" Payload
          ls -la "$IPA"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-v${{ env.APP_VER }}-${{ env.APP_BUILD }}-unsigned-ipa
          path: ${{ env.IPA_NAME }}
          retention-days: 90

      # 构建失败：把错误日志尾部提交回 main（ci-last-error.log），便于本地排查
      - name: Report failure log
        if: failure()
        run: |
          {
            echo "# CI 构建失败日志（run ${GITHUB_RUN_NUMBER}）"
            echo
            if [ -f pod.log ]; then echo "## pod install"; tail -n 60 pod.log; echo; fi
            if [ -f build.log ]; then echo "## xcodebuild（尾部 400 行）"; tail -n 400 build.log; fi
          } > ci-last-error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-last-error.log
          git commit -m "ci: 记录第 ${GITHUB_RUN_NUMBER} 次构建失败日志 [skip ci]"
          git push origin HEAD:main

  # 构建成功后：把 IPA + ios-version.json 发布到 dist 分支（独立 job，不影响构建）
  publish-dist:
    needs: build
    if: success() && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          # Artifact 名现在带版本号，不再写死；按目录整体下载后用文件名匹配
          path: artifacts

      - name: Publish to dist branch
        run: |
          set -e
          exec > >(tee publish.log) 2>&1
          IPA_SRC=$(find artifacts -type f -name 'CarLink-v*-unsigned.ipa' | head -1)
          if [ -z "$IPA_SRC" ]; then echo "未找到 IPA artifact"; exit 1; fi
          echo "IPA_SRC=$IPA_SRC"
          unzip -q "$IPA_SRC" -d ex
          VER=$(python3 -c "import plistlib; print(plistlib.load(open('ex/Payload/CarLink.app/Info.plist','rb'))['CFBundleShortVersionString'])")
          BUILD=$(python3 -c "import plistlib; print(plistlib.load(open('ex/Payload/CarLink.app/Info.plist','rb'))['CFBundleVersion'])")
          cp "$IPA_SRC" "CarLink-v${VER}-unsigned.ipa"
          SIZE=$(stat -c%s "CarLink-v${VER}-unsigned.ipa")
          MD5=$(md5sum "CarLink-v${VER}-unsigned.ipa" | cut -d' ' -f1)
          CHANGELOG=$(git log -1 --pretty=%s)
          DATE=$(date -u +"%Y-%m-%d")
          cat > ios-version.json <<EOF
          {
            "version": "${VER}",
            "build": "${BUILD}",
            "ipaUrl": "https://smartdash-ota.w.zood.org:8888/carlink/CarLink-v${VER}-unsigned.ipa",
            "size": ${SIZE},
            "md5": "${MD5}",
            "changelog": "${CHANGELOG}",
            "date": "${DATE}"
          }
          EOF
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan dist-tmp
          git rm -rq --cached . 2>/dev/null || true
          git add -f "CarLink-v${VER}-unsigned.ipa" ios-version.json
          git commit -m "dist v${VER}(${BUILD}) [skip ci]"
          git push -f origin HEAD:dist

      - name: Report failure log
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          # orphan 分支上直接提交会被拒，回到触发提交再干净地提交日志
          git fetch origin main
          git checkout -f origin/main
          {
            echo "# CI 发布失败日志（run ${GITHUB_RUN_NUMBER}）"
            echo
            echo "## publish-dist 步骤输出（尾部 100 行）"
            tail -n 100 publish.log 2>/dev/null || echo "（无 publish.log）"
          } > ci-last-error.log
          git add ci-last-error.log
          git commit -m "ci: 记录第 ${GITHUB_RUN_NUMBER} 次发布失败 [skip ci]"
          git push origin HEAD:main
