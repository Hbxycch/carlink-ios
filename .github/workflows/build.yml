name: build-ipa

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && pod --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ hashFiles('Podfile.lock') }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: CocoaPods install
        run: pod install --repo-update 2>&1 | tee pod.log

      - name: Build (unsigned Release)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace CarLink.xcworkspace \
            -scheme CarLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath dd \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R dd/Build/Products/Release-iphoneos/CarLink.app Payload/
          zip -qry CarLink-unsigned.ipa Payload
          ls -la CarLink-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-unsigned-ipa
          path: CarLink-unsigned.ipa
          retention-days: 90

      # 构建失败：把错误日志尾部提交回 main（ci-last-error.log），便于本地排查
      - name: Report failure log
        if: failure()
        run: |
          {
            echo "# CI 构建失败日志（run ${GITHUB_RUN_NUMBER}）"
            echo
            if [ -f pod.log ]; then echo "## pod install"; tail -n 60 pod.log; echo; fi
            if [ -f build.log ]; then echo "## xcodebuild（尾部 400 行）"; tail -n 400 build.log; fi
          } > ci-last-error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-last-error.log
          git commit -m "ci: 记录第 ${GITHUB_RUN_NUMBER} 次构建失败日志 [skip ci]"
          git push origin HEAD:main

  # 构建成功后：把 IPA + ios-version.json 发布到 dist 分支（独立 job，不影响构建）
  publish-dist:
    needs: build
    if: success() && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: CarLink-unsigned-ipa

      - name: Publish to dist branch
        run: |
          set -e
          exec > >(tee publish.log) 2>&1
          unzip -q CarLink-unsigned.ipa -d ex
          VER=$(python3 -c "import plistlib; print(plistlib.load(open('ex/Payload/CarLink.app/Info.plist','rb'))['CFBundleShortVersionString'])")
          BUILD=$(python3 -c "import plistlib; print(plistlib.load(open('ex/Payload/CarLink.app/Info.plist','rb'))['CFBundleVersion'])")
          cp CarLink-unsigned.ipa "CarLink-v${VER}-unsigned.ipa"
          SIZE=$(stat -c%s "CarLink-v${VER}-unsigned.ipa")
          MD5=$(md5sum "CarLink-v${VER}-unsigned.ipa" | cut -d' ' -f1)
          CHANGELOG=$(git log -1 --pretty=%s)
          DATE=$(date -u +"%Y-%m-%d")
          cat > ios-version.json <<EOF
          {
            "version": "${VER}",
            "build": "${BUILD}",
            "ipaUrl": "https://smartdash-ota.w.zood.org:8888/carlink/CarLink-v${VER}-unsigned.ipa",
            "size": ${SIZE},
            "md5": "${MD5}",
            "changelog": "${CHANGELOG}",
            "date": "${DATE}"
          }
          EOF
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan dist-tmp
          git rm -rq --cached . 2>/dev/null || true
          git add -f "CarLink-v${VER}-unsigned.ipa" ios-version.json
          git commit -m "dist v${VER}(${BUILD}) [skip ci]"
          git push -f origin HEAD:dist

      - name: Report failure log
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          # orphan 分支上直接提交会被拒，回到触发提交再干净地提交日志
          git fetch origin main
          git checkout -f origin/main
          {
            echo "# CI 发布失败日志（run ${GITHUB_RUN_NUMBER}）"
            echo
            echo "## publish-dist 步骤输出（尾部 100 行）"
            tail -n 100 publish.log 2>/dev/null || echo "（无 publish.log）"
          } > ci-last-error.log
          git add ci-last-error.log
          git commit -m "ci: 记录第 ${GITHUB_RUN_NUMBER} 次发布失败 [skip ci]"
          git push origin HEAD:main
