name: build-ipa

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version && pod --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: CocoaPods install
        run: pod install --repo-update

      - name: Build (unsigned Release)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace CarLink.xcworkspace \
            -scheme CarLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build | xcpretty || xcodebuild \
            -workspace CarLink.xcworkspace \
            -scheme CarLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R dd/Build/Products/Release-iphoneos/CarLink.app Payload/
          zip -qry CarLink-unsigned.ipa Payload
          ls -la CarLink-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLink-unsigned-ipa
          path: CarLink-unsigned.ipa
          retention-days: 90

      - name: Create Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CarLink-unsigned.ipa
          generate_release_notes: true
